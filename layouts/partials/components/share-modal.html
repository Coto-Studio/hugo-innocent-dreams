{{- $url := .Site.BaseURL -}}

<dialog id="share-modal" class="share-modal">
  <button class="close-modal-x" aria-label="Close modal"><span class="icon fa-times"></span></button>
  <header>
    <h2>Share This Story</h2>
  </header>

  {{ partial "components/share-links" (dict "Site" .Site "variant" "modal") }}

  <div class="copy-url-section">
    <label for="share-url-input" class="visually-hidden">Page URL</label>
    <input type="text" id="share-url-input" class="share-url-input" value="{{ $url }}" readonly>
    <button type="button" class="button small copy-url-btn">
      <span class="copy-text">Copy Link</span>
    </button>
    <button type="button" class="button small native-share-btn" aria-label="Share via system">
      <svg class="share-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
        <polyline points="16 6 12 2 8 6"/>
        <line x1="12" y1="2" x2="12" y2="15"/>
      </svg>
      <span>More</span>
    </button>
  </div>
</dialog>
